<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Mohamed Reda, MR GFX. Full-stack developer, creative technologist, AI automation builder.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070a"/><stop offset="1" stop-color="#14160c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c4ff47" stop-opacity="0.55"/><stop offset="1" stop-color="#c4ff47" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c4ff47"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="300" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle r="260" fill="url(#glow)"><animate attributeName="cx" values="180;520;180" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="60;220;60" dur="11s" repeatCount="indefinite"/></circle>
    <circle r="200" fill="url(#glow)" opacity="0.6"><animate attributeName="cx" values="1050;800;1050" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="240;40;240" dur="13s" repeatCount="indefinite"/></circle>
    <g fill="none" stroke="#c4ff47" stroke-opacity="0.35">
      <circle cx="1020" cy="150" r="90"><animate attributeName="r" values="70;110;70" dur="6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0.05;0.5" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="1020" cy="150" r="52"><animate attributeName="r" values="40;70;40" dur="6s" begin="-2s" repeatCount="indefinite"/></circle>
      <rect x="965" y="95" width="110" height="110" rx="18" transform="rotate(12 1020 150)"><animateTransform attributeName="transform" type="rotate" from="0 1020 150" to="360 1020 150" dur="40s" repeatCount="indefinite"/></rect>
    </g>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#c4ff47" font-size="15" opacity="0.8">
      <text x="64" y="70" letter-spacing="3">&lt;/&gt;  MR GFX  ·  KUWAIT</text>
    </g>
    <text x="64" y="162" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="url(#ink)">Mohamed Reda
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="64" y="212" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#e7e7ea">Full-stack developer · Creative technologist · AI automation</text>
    <text x="64" y="252" font-family="'Segoe UI',Tahoma,Arial,sans-serif" font-size="22" fill="#c4ff47">محمد رضا — أبني الهوية والمواقع والأنظمة</text>
    <rect x="0" y="292" height="8" width="1200" fill="#c4ff47"><animate attributeName="width" values="0;1200" dur="1.8s" fill="freeze"/></rect>
  </g>
</svg>
